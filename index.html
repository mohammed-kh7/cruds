<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="crud">
        <div class="head">
            <h2>cruds</h2>
            <p>PRODUCT MANAGEMENT SYSTEM</p>
        </div>
        <!-- start inputs  -->
        <div class="inputs">
            <input type="text" id="title" placeholder="title">
            <div class="price">
                <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
                <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes">
                <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
                <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount">
                <small id="total"></small>
            </div>
            <input type="number" id="count" placeholder="count">
            <input type="text" id="category" placeholder="category">
        </div>
        <button id="submit">Create</button>
        <!-- end inputs  -->
        <!-- start outputs  -->
        <div class="outputs">
            <div class="searchBlock">
                <input onkeyup="searchData(this.value)" id="search" placeholder="search">
            </div>
            <div class="btnSearch">
                <button onclick="getSearchMood(this.id)" id="searctTitle">searct Title</button>
                <button onclick="getSearchMood(this.id)" id="searctCategory">searct Category</button>
            </div>
            <!-- end outputs  -->
            <div>
                <button id="deleteAll" onclick="deleteAllData()">Delete All</button>
            </div>
            <table>
                <tr>
                    <th>id</th>
                    <th>title</th>
                    <th>price</th>
                    <th>taxes</th>
                    <th>ads</th>
                    <th>discount</th>
                    <th>total</th>
                    <th>category</th>
                    <th>update</th>
                    <th>delete</th>
                </tr>
                <tbody id="tbody">
                    <tr>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="./main.js"></script>
    </div>
</body>

</html>
